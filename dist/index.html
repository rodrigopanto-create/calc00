<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>calc00 Vocho Core</title>
  <style>
    html, body {
      background-color: #181818;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#181818">
</head>
<body>
  <!-- El canvas requerido por egui/eframe para renderizar -->
  <canvas id="calc00_canvas"></canvas>

  <!-- Cargador del módulo WASM generado -->
  <script type="module">
  import init, { start } from './calc00.js';

  async function main() {
    await init();
    // Inicializa el motor de egui apuntando al ID de tu canvas
    await start("calc00_canvas");
  }

  main();
</script>

  <!-- Registro del Service Worker para persistencia offline -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Soberanía digital offline activada 🚗⚡'));
    }
  </script>
</body>
</html>
